<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Manage Products | Admin</title>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}


body{

background:#f4fff4;

}



header{

background:#1B5E20;
color:white;
padding:25px;
text-align:center;

}


header h1{

font-size:30px;

}



.container{

max-width:1200px;
margin:30px auto;
padding:20px;

}



.box{

background:white;
padding:25px;
border-radius:10px;
box-shadow:0 0 10px #ccc;
margin-bottom:30px;

}



h2{

color:#2E7D32;
margin-bottom:20px;

}



input,select{

width:100%;
padding:12px;
margin:8px 0;
border:1px solid #ccc;
border-radius:5px;
font-size:16px;

}



button{

padding:12px 20px;
background:#2E7D32;
color:white;
border:none;
border-radius:5px;
cursor:pointer;

}



button:hover{

background:#1B5E20;

}



table{

width:100%;
border-collapse:collapse;

}


th{

background:#2E7D32;
color:white;
padding:12px;

}


td{

padding:12px;
text-align:center;
border-bottom:1px solid #ddd;

}



.delete{

background:red;

}


.edit{

background:#F9A825;
color:black;

}



.back{

display:inline-block;
margin-top:20px;
background:#1B5E20;
color:white;
padding:12px 25px;
text-decoration:none;
border-radius:5px;

}



footer{

background:#2E7D32;
color:white;
padding:15px;
text-align:center;

}



</style>

</head>


<body>



<header>

<h1>
📦 Manage Products
</h1>

<p>
Bundelkhand Organic Farmer Producer Company Limited
</p>

</header>



<div class="container">



<div class="box">


<h2>
➕ Add New Product
</h2>


<input type="text" id="pname"
placeholder="Product Name">


<select id="category">

<option>Cereals</option>
<option>Pulses</option>
<option>Oil Seeds</option>
<option>Organic Products</option>

</select>


<input type="text" id="price"
placeholder="Price Example ₹40/Kg">


<input type="text" id="stock"
placeholder="Stock Available">


<button onclick="addProduct()">

Add Product

</button>


</div>



<div class="box">


<h2>
🌾 Product List
</h2>


<table>


<thead>

<tr>

<th>
Sr No.
</th>

<th>
Product
</th>

<th>
Category
</th>

<th>
Price
</th>

<th>
Stock
</th>

<th>
Action
</th>


</tr>

</thead>


<tbody id="productTable">


</tbody>


</table>



</div> 
  <script>


let products = JSON.parse(localStorage.getItem("products")) || [

{
name:"Organic Wheat",
category:"Cereals",
price:"₹40/Kg",
stock:"Available"
},

{
name:"Organic Chana",
category:"Pulses",
price:"₹80/Kg",
stock:"Available"
},

{
name:"Mustard Seeds",
category:"Oil Seeds",
price:"₹90/Kg",
stock:"Available"
}

];



let editIndex = -1;




// Add Product

function addProduct(){


let name=document.getElementById("pname").value;

let category=document.getElementById("category").value;

let price=document.getElementById("price").value;

let stock=document.getElementById("stock").value;



if(name=="" || price==""){

alert("Please Enter Product Name and Price");

return;

}



let product={

name:name,

category:category,

price:price,

stock:stock

};



if(editIndex==-1){


products.push(product);


}

else{


products[editIndex]=product;

editIndex=-1;


}




localStorage.setItem(

"products",

JSON.stringify(products)

);



clearForm();

displayProducts();


alert("Product Saved Successfully");


}




// Show Products


function displayProducts(){


let table=document.getElementById("productTable");


table.innerHTML="";



products.forEach(function(product,index){


table.innerHTML += `


<tr>


<td>
${index+1}
</td>


<td>
${product.name}
</td>


<td>
${product.category}
</td>


<td>
${product.price}
</td>


<td>
${product.stock}
</td>



<td>


<button class="edit"
onclick="editProduct(${index})">

Edit

</button>



<button class="delete"
onclick="deleteProduct(${index})">

Delete

</button>



</td>


</tr>


`;



});



}





// Delete Product


function deleteProduct(index){


if(confirm("Delete this Product?")){


products.splice(index,1);



localStorage.setItem(

"products",

JSON.stringify(products)

);



displayProducts();


}



}




// Edit Product


function editProduct(index){


let p=products[index];


document.getElementById("pname").value=p.name;


document.getElementById("category").value=p.category;


document.getElementById("price").value=p.price;


document.getElementById("stock").value=p.stock;



editIndex=index;



window.scrollTo({

top:0,

behavior:"smooth"

});


}





function clearForm(){


document.getElementById("pname").value="";

document.getElementById("price").value="";

document.getElementById("stock").value="";


}





// Load Product


displayProducts();



</script> 
  <!-- Back Button -->

<div style="text-align:center;margin-top:30px;">

<a class="back" href="admin-dashboard.html">

⬅ Back To Dashboard

</a>

</div>



</div>


</div>




<footer>

© 2026 Bundelkhand Organic Farmer Producer Company Limited

</footer>



</body>

</html>
