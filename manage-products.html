<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Manage Products | Admin</title>

<link rel="stylesheet" href="css/style.css">


<style>

body{
background:#f4fff4;
font-family:Arial,sans-serif;
}


.admin-header{

background:#1B5E20;
color:white;
padding:25px;
text-align:center;

}


.container{

max-width:1000px;
margin:30px auto;
padding:20px;

}


.box{

background:white;
padding:25px;
border-radius:10px;
box-shadow:0 0 10px #ccc;
margin-bottom:25px;

}


h2{

color:#2E7D32;
margin-bottom:20px;

}


input,select{

width:100%;
padding:12px;
margin:8px 0;
border:1px solid #ccc;
border-radius:5px;

}


button{

background:#2E7D32;
color:white;
padding:12px 20px;
border:none;
border-radius:5px;
cursor:pointer;

}


button:hover{

background:#1B5E20;

}


table{

width:100%;
border-collapse:collapse;

}


th{

background:#2E7D32;
color:white;
padding:12px;

}


td{

padding:12px;
border-bottom:1px solid #ddd;
text-align:center;

}


.delete{

background:red;

}


</style>

</head>


<body>


<header class="admin-header">

<h1>
📦 Manage Products
</h1>

<p>
Bundelkhand Organic Farmer Producer Company Limited
</p>

</header>


<div class="container">


<div class="box">


<h2>
➕ Add New Product
</h2>


<input type="text" id="productName" placeholder="Product Name">


<select id="category">

<option>Cereals</option>

<option>Pulses</option>

<option>Oil Seeds</option>

<option>Organic Products</option>

</select>


<input type="text" id="price" placeholder="Price Example ₹40/Kg">


<input type="text" id="stock" placeholder="Stock Quantity">


<button onclick="addProduct()">

Add Product

</button>


</div> 
  <!-- Product List -->

<div class="box">

<h2>
🌾 Product List
</h2>


<table>


<thead>

<tr>

<th>Sr No.</th>

<th>Product</th>

<th>Category</th>

<th>Price</th>

<th>Stock</th>

<th>Action</th>

</tr>

</thead>


<tbody id="productList">


</tbody>


</table>


</div>


<a href="admin-dashboard.html"
style="
display:inline-block;
background:#1B5E20;
color:white;
padding:12px 25px;
text-decoration:none;
border-radius:5px;
">

⬅ Back To Dashboard

</a>



</div> 
  <script>


// Load Products

let products = JSON.parse(localStorage.getItem("products")) || [];



displayProducts();




// Add Product Function

function addProduct(){


let name =
document.getElementById("productName").value;


let category =
document.getElementById("category").value;


let price =
document.getElementById("price").value;


let stock =
document.getElementById("stock").value;



if(name=="" || price=="" || stock==""){


alert("Please Fill All Details");

return;


}



let product = {


name:name,

category:category,

price:price,

stock:stock


};



products.push(product);



localStorage.setItem(
"products",
JSON.stringify(products)
);



alert("✅ Product Added Successfully");



displayProducts();



document.getElementById("productName").value="";

document.getElementById("price").value="";

document.getElementById("stock").value="";


}






// Display Products


function displayProducts(){



let list =
document.getElementById("productList");



list.innerHTML="";



products.forEach(function(product,index){



list.innerHTML += `


<tr>


<td>${index+1}</td>


<td>${product.name}</td>


<td>${product.category}</td>


<td>${product.price}</td>


<td>${product.stock}</td>


<td>

<button
onclick="editProduct(${index})">

✏️ Edit

</button>

<button
class="delete"
onclick="deleteProduct(${index})">

🗑️ Delete

</button>

</td>


</tr>


`;


});


}







// Delete Product


function deleteProduct(index){



if(confirm("Delete this Product?")){


products.splice(index,1);



localStorage.setItem(
"products",
JSON.stringify(products)
);



displayProducts();



}


}



</script>



</body>

</html>
