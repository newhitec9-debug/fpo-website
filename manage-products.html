```html
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Manage Products | Bundelkhand Organic FPO</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4fff4;
}

/* Header */

header{
background:#1B5E20;
color:white;
padding:25px;
text-align:center;
}

header h1{
font-size:30px;
margin-bottom:8px;
}

/* Container */

.container{
max-width:1100px;
margin:30px auto;
padding:20px;
}

/* Box */

.box{
background:white;
padding:25px;
border-radius:10px;
box-shadow:0 0 10px #ccc;
margin-bottom:25px;
}

.box h2{
color:#2E7D32;
margin-bottom:20px;
}

/* Form */

input,
select{
width:100%;
padding:12px;
margin:8px 0;
border:1px solid #ccc;
border-radius:5px;
font-size:16px;
}

button{
background:#2E7D32;
color:white;
padding:11px 18px;
border:none;
border-radius:5px;
cursor:pointer;
margin:3px;
}

button:hover{
background:#1B5E20;
}

.update{
background:#1565C0;
}

.update:hover{
background:#0D47A1;
}

.cancel{
background:#757575;
}

.cancel:hover{
background:#424242;
}

.delete{
background:#D32F2F;
}

.delete:hover{
background:#B71C1C;
}

/* Search */

.search{
margin-bottom:20px;
}

/* Table */

.table-container{
overflow-x:auto;
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:#2E7D32;
color:white;
padding:12px;
}

td{
padding:12px;
border-bottom:1px solid #ddd;
text-align:center;
}

tr:hover{
background:#f1f8e9;
}

/* Back Button */

.back{
display:inline-block;
background:#1B5E20;
color:white;
padding:12px 25px;
text-decoration:none;
border-radius:5px;
}

.back:hover{
background:#2E7D32;
}

/* Mobile */

@media(max-width:600px){

.container{
padding:10px;
}

header h1{
font-size:24px;
}

.box{
padding:15px;
}

}

</style>

</head>


<body>


<!-- Header -->

<header>

<h1>
📦 Manage Products
</h1>

<p>
Bundelkhand Organic Farmer Producer Company Limited
</p>

</header>


<div class="container">


<!-- Add Product -->

<div class="box">

<h2 id="formTitle">
➕ Add New Product
</h2>


<input
type="text"
id="productName"
placeholder="Product Name"
>


<select id="category">

<option value="">Select Category</option>

<option value="Cereals">
Cereals
</option>

<option value="Pulses">
Pulses
</option>

<option value="Oil Seeds">
Oil Seeds
</option>

<option value="Organic Products">
Organic Products
</option>

</select>


<input
type="text"
id="price"
placeholder="Price Example ₹40/Kg"
>


<input
type="text"
id="stock"
placeholder="Stock Quantity"
>


<button
id="saveButton"
onclick="saveProduct()"
>

➕ Add Product

</button>


<button
id="cancelButton"
class="cancel"
onclick="cancelEdit()"
style="display:none;"
>

❌ Cancel

</button>


</div>


<!-- Product List -->

<div class="box">

<h2>
🌾 Product List
</h2>


<input
type="text"
id="search"
class="search"
placeholder="🔍 Search Product..."
onkeyup="searchProducts()"
>


<div class="table-container">

<table>

<thead>

<tr>

<th>Sr No.</th>

<th>Product</th>

<th>Category</th>

<th>Price</th>

<th>Stock</th>

<th>Action</th>

</tr>

</thead>


<tbody id="productList">

</tbody>

</table>

</div>

</div>


<!-- Back -->

<a
href="admin-dashboard.html"
class="back"
>

⬅ Back To Dashboard

</a>


</div>


<script>


// Get Products From Local Storage

let products =
JSON.parse(localStorage.getItem("products")) || [];


let editIndex = -1;


// Display Products

displayProducts();


// Save / Add / Update Product

function saveProduct(){


let name =
document.getElementById("productName").value.trim();


let category =
document.getElementById("category").value;


let price =
document.getElementById("price").value.trim();


let stock =
document.getElementById("stock").value.trim();


if(
name === "" ||
category === "" ||
price === "" ||
stock === ""
){

alert("⚠️ Please Fill All Details");

return;

}


let product = {

name:name,

category:category,

price:price,

stock:stock

};


// Add New Product

if(editIndex === -1){

products.push(product);

alert("✅ Product Added Successfully");

}


// Update Existing Product

else{

products[editIndex] = product;

alert("✅ Product Updated Successfully");

editIndex = -1;

document.getElementById("formTitle").innerHTML =
"➕ Add New Product";

document.getElementById("saveButton").innerHTML =
"➕ Add Product";

document.getElementById("cancelButton").style.display =
"none";

}


// Save Data

localStorage.setItem(
"products",
JSON.stringify(products)
);


// Clear Form

clearForm();


// Display

displayProducts();

}


// Display Product List

function displayProducts(){

let list =
document.getElementById("productList");

list.innerHTML = "";


if(products.length === 0){

list.innerHTML = `

<tr>

<td colspan="6">

No Products Added Yet

</td>

</tr>

`;

return;

}


products.forEach(function(product,index){

list.innerHTML += `

<tr>

<td>
${index + 1}
</td>

<td>
${product.name}
</td>

<td>
${product.category}
</td>

<td>
${product.price}
</td>

<td>
${product.stock}
</td>

<td>

<button
onclick="editProduct(${index})"
>

✏️ Edit

</button>


<button
class="delete"
onclick="deleteProduct(${index})"
>

🗑️ Delete

</button>

</td>

</tr>

`;

});

}


// Edit Product

function editProduct(index){

let product =
products[index];


document.getElementById("productName").value =
product.name;


document.getElementById("category").value =
product.category;


document.getElementById("price").value =
product.price;


document.getElementById("stock").value =
product.stock;


editIndex = index;


document.getElementById("formTitle").innerHTML =
"✏️ Edit Product";


document.getElementById("saveButton").innerHTML =
"🔄 Update Product";


document.getElementById("cancelButton").style.display =
"inline-block";


window.scrollTo({

top:0,

behavior:"smooth"

});

}


// Cancel Edit

function cancelEdit(){

editIndex = -1;

clearForm();


document.getElementById("formTitle").innerHTML =
"➕ Add New Product";


document.getElementById("saveButton").innerHTML =
"➕ Add Product";


document.getElementById("cancelButton").style.display =
"none";

}


// Delete Product

function deleteProduct(index){

if(
confirm("⚠️ Are you sure you want to delete this product?")
){

products.splice(index,1);


localStorage.setItem(
"products",
JSON.stringify(products)
);


displayProducts();


alert("🗑️ Product Deleted Successfully");

}

}


// Clear Form

function clearForm(){

document.getElementById("productName").value = "";

document.getElementById("category").value = "";

document.getElementById("price").value = "";

document.getElementById("stock").value = "";

}


// Search Products

function searchProducts(){

let search =
document.getElementById("search")
.value
.toLowerCase();


let rows =
document.querySelectorAll("#productList tr");


rows.forEach(function(row){

let text =
row.textContent.toLowerCase();


if(text.includes(search)){

row.style.display = "";

}

else{

row.style.display = "none";

}

});

}

</script>


</body>

</html>
```
