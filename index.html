```html
<!-- =====================================
     AGRICULTURE NEWS
===================================== -->

<section class="agriculture-news">

    <div class="news-container">

        <h2>📰 Agriculture News</h2>

        <p class="news-subtitle">
            किसानों और कृषि से जुड़ी महत्वपूर्ण खबरें
        </p>

        <div id="homeNewsList" class="news-list">

            <!-- News JavaScript से यहाँ आएगी -->

        </div>

    </div>

</section>


<style>

.agriculture-news{

    background:#f4fff4;

    padding:50px 20px;

}

.news-container{

    max-width:1100px;

    margin:auto;

}

.agriculture-news h2{

    text-align:center;

    color:#1B5E20;

    font-size:30px;

    margin-bottom:8px;

}

.news-subtitle{

    text-align:center;

    color:#666;

    margin-bottom:30px;

}

.news-list{

    display:grid;

    grid-template-columns:
    repeat(auto-fit,minmax(280px,1fr));

    gap:20px;

}

.news-card{

    background:white;

    padding:22px;

    border-radius:10px;

    box-shadow:0 0 10px #ccc;

    border-left:5px solid #2E7D32;

}

.news-card h3{

    color:#2E7D32;

    margin-bottom:12px;

    font-size:20px;

}

.news-card p{

    line-height:1.6;

    margin-bottom:12px;

}

.news-date{

    color:#777;

    font-size:14px;

    font-weight:bold;

}

.no-news{

    text-align:center;

    background:white;

    padding:25px;

    border-radius:10px;

    color:#777;

}

</style>


<script>

/* =====================================
   LOAD AGRICULTURE NEWS
===================================== */

let agricultureNews =

JSON.parse(
    localStorage.getItem("agricultureNews")
) || [];


let homeNewsList =

document.getElementById(
    "homeNewsList"
);


/* =====================================
   DISPLAY NEWS
===================================== */

if(agricultureNews.length === 0){

    homeNewsList.innerHTML = `

        <div class="no-news">

            📰 अभी कोई Agriculture News उपलब्ध नहीं है।

        </div>

    `;

}

else{

    agricultureNews.forEach(function(news){

        homeNewsList.innerHTML += `

            <div class="news-card">

                <h3>
                    🌾 ${news.title}
                </h3>

                <p>
                    ${news.description}
                </p>

                <div class="news-date">

                    📅 ${news.date}

                </div>

            </div>

        `;

    });

}

</script>
```
