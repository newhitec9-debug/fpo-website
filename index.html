```html
<!-- =========================================
     AGRICULTURE NEWS SECTION
========================================= -->

<section class="agriculture-news">

    <div class="news-container">

        <div class="news-heading">

            <h2>📰 Agriculture News</h2>

            <p>
                किसानों और कृषि से जुड़ी महत्वपूर्ण खबरें
            </p>

        </div>


        <div
            id="homeNewsList"
            class="home-news-list"
        >
        </div>


        <div class="all-news-button">

            <a href="news.html">
                📰 View All News
            </a>

        </div>

    </div>

</section>


<style>

/* =========================================
   NEWS SECTION
========================================= */

.agriculture-news{

    background:#f4fff4;

    padding:50px 20px;

}

.news-container{

    max-width:1100px;

    margin:auto;

}

.news-heading{

    text-align:center;

    margin-bottom:30px;

}

.news-heading h2{

    color:#1B5E20;

    font-size:30px;

    margin-bottom:8px;

}

.news-heading p{

    color:#666;

}


/* NEWS GRID */

.home-news-list{

    display:grid;

    grid-template-columns:
    repeat(auto-fit,minmax(280px,1fr));

    gap:20px;

}


/* NEWS CARD */

.home-news-card{

    background:white;

    padding:22px;

    border-radius:10px;

    box-shadow:0 0 10px #ccc;

    border-left:5px solid #2E7D32;

}

.home-news-card h3{

    color:#2E7D32;

    font-size:20px;

    line-height:1.5;

    margin-bottom:12px;

}

.home-news-card p{

    line-height:1.6;

    margin-bottom:12px;

}

.home-news-date{

    color:#777;

    font-size:14px;

    font-weight:bold;

    margin-bottom:15px;

}


/* READ MORE */

.home-read-more{

    display:inline-block;

    background:#2E7D32;

    color:white;

    padding:10px 18px;

    border-radius:5px;

    text-decoration:none;

    font-weight:bold;

}

.home-read-more:hover{

    background:#1B5E20;

}


/* VIEW ALL */

.all-news-button{

    text-align:center;

    margin-top:30px;

}

.all-news-button a{

    display:inline-block;

    background:#1B5E20;

    color:white;

    padding:12px 25px;

    border-radius:5px;

    text-decoration:none;

    font-weight:bold;

}

.all-news-button a:hover{

    background:#2E7D32;

}


/* NO NEWS */

.home-no-news{

    background:white;

    padding:25px;

    text-align:center;

    border-radius:10px;

    color:#777;

}


/* MOBILE */

@media(max-width:600px){

    .agriculture-news{

        padding:35px 15px;

    }

    .news-heading h2{

        font-size:25px;

    }

}

</style>


<script>

/* =========================================
   LOAD NEWS FROM ADMIN
========================================= */

let homeAgricultureNews =

JSON.parse(

    localStorage.getItem(
        "agricultureNews"
    )

) || [];


let homeNewsList =

document.getElementById(
    "homeNewsList"
);


/* =========================================
   DISPLAY NEWS
========================================= */

if(

    homeAgricultureNews.length === 0

){

    homeNewsList.innerHTML = `

        <div class="home-no-news">

            📰 अभी कोई Agriculture News उपलब्ध नहीं है।

        </div>

    `;

}

else{


    /*
       केवल Latest 3 News Home Page पर
    */

    let latestNews =

        homeAgricultureNews
        .slice()
        .reverse()
        .slice(0,3);


    latestNews.forEach(

        function(news){

            /*
               Original News का index
               निकालना जरूरी है
            */

            let originalIndex =

                homeAgricultureNews
                .indexOf(news);


            homeNewsList.innerHTML += `

                <div class="home-news-card">

                    <h3>

                        🌾 ${news.title}

                    </h3>


                    <p>

                        ${news.description}

                    </p>


                    <div class="home-news-date">

                        📅 ${news.date}

                    </div>


                    <a

                        href="news-details.html?id=${originalIndex}"

                        class="home-read-more"

                    >

                        👁️ Read More

                    </a>

                </div>

            `;

        }

    );

}

</script>
```
