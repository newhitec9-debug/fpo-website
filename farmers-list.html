<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Approved Farmers | Bundelkhand Organic FPO
</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f4fff4;
}

header{
    background:#1B5E20;
    color:white;
    text-align:center;
    padding:25px 10px;
}

header h1{
    margin-bottom:8px;
}

.container{
    max-width:1100px;
    margin:30px auto;
    padding:20px;
}

.box{
    background:white;
    padding:25px;
    border-radius:10px;
    box-shadow:0 0 10px #ccc;
}

h2{
    color:#2E7D32;
    margin-bottom:20px;
    text-align:center;
}

.search-box{
    width:100%;
    padding:14px;
    font-size:17px;
    border:1px solid #ccc;
    border-radius:6px;
    margin-bottom:20px;
}

.table-container{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:800px;
}

th{
    background:#2E7D32;
    color:white;
    padding:12px;
}

td{
    padding:12px;
    border:1px solid #ddd;
    text-align:center;
}

.approved{
    color:green;
    font-weight:bold;
}

.delete-btn{
    background:#D32F2F;
    color:white;
    border:none;
    padding:8px 12px;
    border-radius:5px;
    cursor:pointer;
}

.delete-btn:hover{
    background:#B71C1C;
}

.back{
    display:inline-block;
    margin-top:20px;
    background:#1565C0;
    color:white;
    padding:12px 20px;
    text-decoration:none;
    border-radius:5px;
}

footer{
    margin-top:40px;
    background:#2E7D32;
    color:white;
    text-align:center;
    padding:15px;
}

.empty{
    text-align:center;
    padding:20px;
    color:#777;
}

.count-box{
    text-align:center;
    margin-bottom:18px;
    padding:12px;
    background:#E8F5E9;
    border-radius:7px;
    color:#2E7D32;
    font-weight:bold;
}

</style>

</head>

<body>


<!-- =========================
     HEADER
========================= -->

<header>

<h1>
👨‍🌾 Approved Farmers
</h1>

<p>
Bundelkhand Organic Farmer Producer Company Limited
</p>

</header>


<!-- =========================
     MAIN
========================= -->

<div class="container">

<div class="box">

<h2>
👥 Registered Approved Farmers
</h2>


<!-- =========================
     COUNT
========================= -->

<div
class="count-box"
id="farmerCount"
>
Approved Farmers: 0
</div>


<!-- =========================
     SEARCH
========================= -->

<input
type="text"
id="search"
class="search-box"
placeholder="🔍 किसान का नाम खोजें..."
onkeyup="searchFarmers()"
>


<!-- =========================
     TABLE
========================= -->

<div class="table-container">

<table>

<thead>

<tr>

<th>
Sr No.
</th>

<th>
Farmer Name
</th>

<th>
Mobile
</th>

<th>
Village
</th>

<th>
District
</th>

<th>
Main Crop
</th>

<th>
Status
</th>

<th>
Action
</th>

</tr>

</thead>


<tbody
id="farmersTable"
>
</tbody>

</table>

</div>


<!-- =========================
     BACK
========================= -->

<a
href="admin-dashboard.html"
class="back"
>
⬅ Back to Admin Dashboard
</a>


</div>

</div>


<!-- =========================
     FOOTER
========================= -->

<footer>

© 2026 Bundelkhand Organic Farmer Producer Company Limited

</footer>


<script>


/* =====================================================
   GET MEMBERS
===================================================== */

function getMembers(){

    try{

        let data =
        localStorage.getItem(
            "members"
        );

        if(!data){

            return [];

        }

        let members =
        JSON.parse(data);

        return Array.isArray(members)
            ? members
            : [];

    }catch(error){

        console.error(
            "Members Error:",
            error
        );

        return [];

    }

}


/* =====================================================
   GET APPROVED FARMERS
===================================================== */

function getApprovedFarmers(){

    let members =
    getMembers();


    return members.filter(
        function(member){

            return String(
                member.status || ""
            ).toLowerCase()
            === "approved";

        }
    );

}


/* =====================================================
   UPDATE COUNT
===================================================== */

function updateFarmerCount(){

    let farmers =
    getApprovedFarmers();


    document.getElementById(
        "farmerCount"
    ).textContent =
        "Approved Farmers: "
        + farmers.length;

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

    return String(
        value ?? ""
    )
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =====================================================
   DISPLAY FARMERS
===================================================== */

function displayFarmers(list){

    let table =
    document.getElementById(
        "farmersTable"
    );


    table.innerHTML =
        "";


    if(list.length === 0){

        table.innerHTML = `

            <tr>

                <td
                    colspan="8"
                    class="empty"
                >

                    अभी कोई Approved Farmer
                    उपलब्ध नहीं है।

                </td>

            </tr>

        `;

        updateFarmerCount();

        return;

    }


    list.forEach(
        function(farmer){

            let row =
            document.createElement(
                "tr"
            );


            /*
               Farmer की original
               members array में position
               सुरक्षित रखें।
            */

            row.innerHTML = `

                <td>
                    ${farmer.displayIndex}
                </td>

                <td>
                    ${escapeHTML(
                        farmer.name
                    )}
                </td>

                <td>
                    ${escapeHTML(
                        farmer.mobile
                    )}
                </td>

                <td>
                    ${escapeHTML(
                        farmer.village
                    )}
                </td>

                <td>
                    ${escapeHTML(
                        farmer.district
                    )}
                </td>

                <td>
                    ${escapeHTML(
                        farmer.crop
                    )}
                </td>

                <td class="approved">

                    🟢 Approved

                </td>

                <td>

                    <button

                        class="delete-btn"

                        onclick="
                            deleteFarmerByMemberIndex(
                                ${farmer.memberIndex}
                            )
                        "

                    >

                        🗑️ Delete

                    </button>

                </td>

            `;


            table.appendChild(
                row
            );

        }
    );


    updateFarmerCount();

}


/* =====================================================
   PREPARE APPROVED FARMERS
===================================================== */

function prepareApprovedFarmers(){

    let members =
    getMembers();


    let approved = [];


    members.forEach(
        function(member,index){

            if(
                String(
                    member.status || ""
                ).toLowerCase()
                === "approved"
            ){

                approved.push({

                    ...member,

                    memberIndex:index,

                    displayIndex:
                        approved.length + 1

                });

            }

        }
    );


    return approved;

}


/* =====================================================
   SEARCH FARMERS
===================================================== */

function searchFarmers(){

    let search =
    document.getElementById(
        "search"
    )
    .value
    .toLowerCase()
    .trim();


    let farmers =
    prepareApprovedFarmers();


    if(search === ""){

        displayFarmers(
            farmers
        );

        return;

    }


    let filtered =
    farmers.filter(
        function(farmer){

            return (

                String(
                    farmer.name || ""
                )
                .toLowerCase()
                .includes(search)

                ||

                String(
                    farmer.mobile || ""
                )
                .toLowerCase()
                .includes(search)

                ||

                String(
                    farmer.village || ""
                )
                .toLowerCase()
                .includes(search)

                ||

                String(
                    farmer.district || ""
                )
                .toLowerCase()
                .includes(search)

                ||

                String(
                    farmer.crop || ""
                )
                .toLowerCase()
                .includes(search)

            );

        }
    );


    /*
       Search result की numbering
       1, 2, 3... रखी जाएगी।
    */

    filtered =
    filtered.map(
        function(farmer,index){

            return {

                ...farmer,

                displayIndex:
                    index + 1

            };

        }
    );


    displayFarmers(
        filtered
    );

}


/* =====================================================
   DELETE FARMER
===================================================== */

function deleteFarmerByMemberIndex(
    memberIndex
){

    let members =
    getMembers();


    if(
        memberIndex < 0 ||
        memberIndex >= members.length
    ){

        alert(
            "Farmer record नहीं मिला।"
        );

        return;

    }


    let farmer =
    members[memberIndex];


    if(
        !farmer ||
        String(
            farmer.status || ""
        ).toLowerCase()
        !== "approved"
    ){

        alert(
            "यह Approved Farmer record नहीं है।"
        );

        return;

    }


    let farmerName =
        farmer.name ||
        "इस Farmer";


    let confirmation =
    confirm(

        "क्या आप '" +
        farmerName +
        "' को Delete करना चाहते हैं?"

    );


    if(!confirmation){

        return;

    }


    /*
       Original members array से
       exact record delete करें।
    */

    members.splice(
        memberIndex,
        1
    );


    localStorage.setItem(
        "members",
        JSON.stringify(
            members
        )
    );


    alert(
        "Farmer successfully deleted!"
    );


    /*
       Search field खाली करके
       पूरी approved list दिखाएँ।
    */

    document.getElementById(
        "search"
    ).value =
        "";


    displayFarmers(
        prepareApprovedFarmers()
    );

}


/* =====================================================
   PAGE LOAD
===================================================== */

displayFarmers(
    prepareApprovedFarmers()
);

updateFarmerCount();


</script>


</body>

</html>
