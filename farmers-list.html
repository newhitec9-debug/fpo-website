<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>
Approved Farmers | Bundelkhand Organic Farmer Producer Company Limited
</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#f4fff4;
    color:#263238;
}

/* HEADER */

header{
    background:linear-gradient(135deg,#1b5e20,#2e7d32,#43a047);
    color:white;
    text-align:center;
    padding:28px 15px;
}

header h1{
    font-size:28px;
    margin-bottom:8px;
}

header p{
    font-size:16px;
}

/* CONTAINER */

.container{
    max-width:1200px;
    margin:30px auto;
    padding:20px;
}

/* BOX */

.box{
    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 5px 18px rgba(0,0,0,.10);
}

/* TITLE */

h2{
    color:#2e7d32;
    margin-bottom:20px;
    text-align:center;
    font-size:24px;
}

/* COUNT */

.count-box{
    text-align:center;
    margin-bottom:20px;
    padding:14px;
    background:#e8f5e9;
    border-radius:8px;
    color:#1b5e20;
    font-weight:bold;
    font-size:18px;
}

/* SEARCH */

.search-box{
    width:100%;
    padding:14px;
    font-size:16px;
    border:2px solid #c8e6c9;
    border-radius:7px;
    margin-bottom:20px;
    outline:none;
}

.search-box:focus{
    border-color:#2e7d32;
}

/* TABLE */

.table-container{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:900px;
}

th{
    background:#2e7d32;
    color:white;
    padding:13px 10px;
    border:1px solid #1b5e20;
}

td{
    padding:12px 10px;
    border:1px solid #ddd;
    text-align:center;
    background:#fff;
}

tbody tr:hover td{
    background:#f1f8e9;
}

/* STATUS */

.approved{
    color:#2e7d32;
    font-weight:bold;
}

/* DELETE BUTTON */

.delete-btn{
    background:#d32f2f;
    color:white;
    border:none;
    padding:8px 14px;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
}

.delete-btn:hover{
    background:#b71c1c;
}

/* BACK BUTTON */

.back{
    display:inline-block;
    margin-top:22px;
    background:#1565c0;
    color:white;
    padding:12px 22px;
    text-decoration:none;
    border-radius:6px;
    font-weight:bold;
}

.back:hover{
    background:#0d47a1;
}

/* EMPTY */

.empty{
    text-align:center;
    padding:25px;
    color:#777;
}

/* FOOTER */

footer{
    margin-top:40px;
    background:#1b5e20;
    color:white;
    text-align:center;
    padding:20px 15px;
}

footer p{
    margin:5px 0;
}

/* MOBILE */

@media(max-width:700px){

    header h1{
        font-size:22px;
    }

    header p{
        font-size:14px;
    }

    .container{
        padding:10px;
        margin:20px auto;
    }

    .box{
        padding:15px;
    }

    h2{
        font-size:20px;
    }

    .count-box{
        font-size:16px;
    }

}

</style>

</head>


<body>


<!-- HEADER -->

<header>

    <h1>
        Approved Farmers
    </h1>

    <p>
        Bundelkhand Organic Farmer Producer Company Limited
    </p>

</header>


<!-- MAIN -->

<div class="container">

    <div class="box">

        <h2>
            Registered Approved Farmers
        </h2>


        <!-- COUNT -->

        <div
            class="count-box"
            id="farmerCount"
        >
            Approved Farmers: 0
        </div>


        <!-- SEARCH -->

        <input
            type="text"
            id="search"
            class="search-box"
            placeholder="किसान का नाम, मोबाइल, गांव या फसल खोजें"
            onkeyup="searchFarmers()"
        >


        <!-- TABLE -->

        <div class="table-container">

            <table>

                <thead>

                    <tr>

                        <th>
                            Sr No.
                        </th>

                        <th>
                            Farmer Name
                        </th>

                        <th>
                            Mobile
                        </th>

                        <th>
                            Village
                        </th>

                        <th>
                            District
                        </th>

                        <th>
                            Main Crop
                        </th>

                        <th>
                            Status
                        </th>

                        <th>
                            Action
                        </th>

                    </tr>

                </thead>


                <tbody id="farmersTable">

                </tbody>

            </table>

        </div>


        <!-- BACK -->

        <a
            href="admin-dashboard.html"
            class="back"
        >
            Back to Admin Dashboard
        </a>

    </div>

</div>


<!-- FOOTER -->

<footer>

    <p>
        Bundelkhand Organic Farmer Producer Company Limited
    </p>

    <p>
        © 2026 All Rights Reserved
    </p>

</footer>


<script>

/* =====================================================
   GET MEMBERS
   IMPORTANT:
   Farmers data is stored in localStorage key:
   "members"
===================================================== */

function getMembers(){

    try{

        const data =
            localStorage.getItem("members");

        if(!data){

            return [];

        }

        const members =
            JSON.parse(data);

        if(!Array.isArray(members)){

            return [];

        }

        return members;

    }
    catch(error){

        console.error(
            "Members Error:",
            error
        );

        return [];

    }

}


/* =====================================================
   GET APPROVED FARMERS
===================================================== */

function getApprovedFarmers(){

    const members =
        getMembers();

    return members.filter(
        function(member){

            if(
                !member ||
                typeof member !== "object"
            ){

                return false;

            }

            return String(
                member.status || ""
            )
            .trim()
            .toLowerCase()
            === "approved";

        }
    );

}


/* =====================================================
   UPDATE FARMER COUNT
===================================================== */

function updateFarmerCount(){

    const farmers =
        getApprovedFarmers();

    document.getElementById(
        "farmerCount"
    ).textContent =
        "Approved Farmers: "
        + farmers.length;

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

    return String(
        value ?? ""
    )
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =====================================================
   PREPARE APPROVED FARMERS
===================================================== */

function prepareApprovedFarmers(){

    const members =
        getMembers();

    const approved = [];


    members.forEach(
        function(member,index){

            if(
                member &&
                String(
                    member.status || ""
                )
                .trim()
                .toLowerCase()
                === "approved"
            ){

                approved.push({

                    ...member,

                    memberIndex:index,

                    displayIndex:
                        approved.length + 1

                });

            }

        }
    );


    return approved;

}


/* =====================================================
   DISPLAY FARMERS
===================================================== */

function displayFarmers(list){

    const table =
        document.getElementById(
            "farmersTable"
        );

    table.innerHTML = "";


    if(
        !Array.isArray(list) ||
        list.length === 0
    ){

        table.innerHTML = `

            <tr>

                <td
                    colspan="8"
                    class="empty"
                >
                    अभी कोई Approved Farmer
                    उपलब्ध नहीं है।
                </td>

            </tr>

        `;

        updateFarmerCount();

        return;

    }


    list.forEach(
        function(farmer){

            const row =
                document.createElement("tr");


            row.innerHTML = `

                <td>
                    ${farmer.displayIndex}
                </td>

                <td>
                    ${escapeHTML(
                        farmer.name
                    )}
                </td>

                <td>
                    ${escapeHTML(
                        farmer.mobile
                    )}
                </td>

                <td>
                    ${escapeHTML(
                        farmer.village
                    )}
                </td>

                <td>
                    ${escapeHTML(
                        farmer.district
                    )}
                </td>

                <td>
                    ${escapeHTML(
                        farmer.crop
                    )}
                </td>

                <td class="approved">
                    Approved
                </td>

                <td>

                    <button
                        type="button"
                        class="delete-btn"
                        onclick="
                            deleteFarmerByMemberIndex(
                                ${farmer.memberIndex}
                            )
                        "
                    >
                        Delete
                    </button>

                </td>

            `;


            table.appendChild(row);

        }
    );


    updateFarmerCount();

}


/* =====================================================
   SEARCH FARMERS
===================================================== */

function searchFarmers(){

    const searchInput =
        document.getElementById("search");

    const search =
        String(
            searchInput.value || ""
        )
        .toLowerCase()
        .trim();


    const farmers =
        prepareApprovedFarmers();


    if(search === ""){

        displayFarmers(
            farmers
        );

        return;

    }


    let filtered =
        farmers.filter(
            function(farmer){

                return (

                    String(
                        farmer.name || ""
                    )
                    .toLowerCase()
                    .includes(search)

                    ||

                    String(
                        farmer.mobile || ""
                    )
                    .toLowerCase()
                    .includes(search)

                    ||

                    String(
                        farmer.village || ""
                    )
                    .toLowerCase()
                    .includes(search)

                    ||

                    String(
                        farmer.district || ""
                    )
                    .toLowerCase()
                    .includes(search)

                    ||

                    String(
                        farmer.crop || ""
                    )
                    .toLowerCase()
                    .includes(search)

                );

            }
        );


    /*
       Search result numbering
       starts from 1
    */

    filtered =
        filtered.map(
            function(farmer,index){

                return {

                    ...farmer,

                    displayIndex:
                        index + 1

                };

            }
        );


    displayFarmers(
        filtered
    );

}


/* =====================================================
   DELETE APPROVED FARMER
===================================================== */

function deleteFarmerByMemberIndex(
    memberIndex
){

    const members =
        getMembers();


    if(
        !Number.isInteger(memberIndex) ||
        memberIndex < 0 ||
        memberIndex >= members.length
    ){

        alert(
            "Farmer record नहीं मिला।"
        );

        return;

    }


    const farmer =
        members[memberIndex];


    if(
        !farmer ||
        String(
            farmer.status || ""
        )
        .trim()
        .toLowerCase()
        !== "approved"
    ){

        alert(
            "यह Approved Farmer record नहीं है।"
        );

        return;

    }


    const farmerName =
        farmer.name ||
        "इस Farmer";


    const confirmation =
        confirm(
            "क्या आप '" +
            farmerName +
            "' को Delete करना चाहते हैं?"
        );


    if(!confirmation){

        return;

    }


    /*
       Original members array से
       exact record delete करें।
    */

    members.splice(
        memberIndex,
        1
    );


    localStorage.setItem(
        "members",
        JSON.stringify(members)
    );


    alert(
        "Farmer successfully deleted!"
    );


    /*
       Search clear करें
    */

    document.getElementById(
        "search"
    ).value = "";


    /*
       Updated list दिखाएँ
    */

    displayFarmers(
        prepareApprovedFarmers()
    );

}


/* =====================================================
   PAGE LOAD
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        displayFarmers(
            prepareApprovedFarmers()
        );

        updateFarmerCount();

    }
);


/* =====================================================
   PAGE SHOW
===================================================== */

window.addEventListener(
    "pageshow",
    function(){

        displayFarmers(
            prepareApprovedFarmers()
        );

        updateFarmerCount();

    }
);

</script>


</body>

</html>
