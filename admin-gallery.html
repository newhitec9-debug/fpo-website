```html
<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Gallery - Bundelkhand Organic FPO</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f8f4;
            color: #222;
        }

        /* Header */
        .header {
            background: #166534;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 15px;
        }

        /* Main Container */
        .container {
            width: 95%;
            max-width: 1100px;
            margin: 25px auto;
        }

        /* Top Buttons */
        .top-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .btn {
            display: inline-block;
            padding: 11px 18px;
            border-radius: 6px;
            text-decoration: none;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 15px;
        }

        .dashboard-btn {
            background: #2563eb;
        }

        .home-btn {
            background: #475569;
        }

        /* Add Gallery Box */
        .add-box {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.10);
            margin-bottom: 30px;
        }

        .add-box h2 {
            color: #166534;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        .add-btn {
            background: #16a34a;
        }

        .add-btn:hover {
            background: #15803d;
        }

        /* Gallery */
        .gallery-box {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.10);
        }

        .gallery-box h2 {
            color: #166534;
            margin-bottom: 20px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 20px;
        }

        .gallery-item {
            background: #f8fafc;
            border: 1px solid #ddd;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .gallery-item img {
            width: 100%;
            height: 190px;
            object-fit: cover;
            display: block;
        }

        .gallery-info {
            padding: 12px;
        }

        .gallery-info h3 {
            font-size: 16px;
            margin-bottom: 10px;
            color: #166534;
            word-break: break-word;
        }

        .delete-btn {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 5px;
            background: #dc2626;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        .delete-btn:hover {
            background: #b91c1c;
        }

        .empty-message {
            text-align: center;
            padding: 30px;
            color: #666;
            font-size: 17px;
        }

        /* Message */
        #message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 5px;
            display: none;
            font-weight: bold;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        /* Mobile */
        @media (max-width: 600px) {

            .header h1 {
                font-size: 22px;
            }

            .container {
                width: 92%;
            }

            .gallery-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <div class="header">

        <h1>🖼️ Gallery Management</h1>

        <p>
            Bundelkhand Organic Farmer Producer Company Limited
        </p>

    </div>


    <div class="container">

        <!-- TOP BUTTONS -->
        <div class="top-buttons">

            <a href="admin-dashboard.html"
               class="btn dashboard-btn">
                🏠 Admin Dashboard
            </a>

            <a href="gallery.html"
               class="btn home-btn">
                👁️ View Public Gallery
            </a>

        </div>


        <!-- ADD PHOTO -->
        <div class="add-box">

            <h2>➕ Add New Gallery Photo</h2>

            <form id="galleryForm">

                <div class="form-group">

                    <label for="photoTitle">
                        Photo Title
                    </label>

                    <input
                        type="text"
                        id="photoTitle"
                        placeholder="जैसे - किसान प्रशिक्षण कार्यक्रम"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="photoUrl">
                        Photo URL
                    </label>

                    <input
                        type="url"
                        id="photoUrl"
                        placeholder="https://example.com/photo.jpg"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn add-btn">
                    ➕ Add Photo
                </button>

            </form>

            <div id="message"></div>

        </div>


        <!-- GALLERY LIST -->
        <div class="gallery-box">

            <h2>📷 Gallery Photos</h2>

            <div
                id="galleryGrid"
                class="gallery-grid">
            </div>

        </div>

    </div>


    <script>

        /* =========================================
           GALLERY DATA
        ========================================= */

        let galleryData =
            JSON.parse(localStorage.getItem("fpoGallery")) || [];


        /* =========================================
           DISPLAY GALLERY
        ========================================= */

        function displayGallery() {

            const galleryGrid =
                document.getElementById("galleryGrid");

            galleryGrid.innerHTML = "";


            /* No Photo */
            if (galleryData.length === 0) {

                galleryGrid.innerHTML = `
                    <div class="empty-message">
                        🖼️ अभी Gallery में कोई फोटो नहीं है।
                    </div>
                `;

                return;
            }


            /* Show Photos */
            galleryData.forEach(function(photo, index) {

                const item =
                    document.createElement("div");

                item.className = "gallery-item";


                item.innerHTML = `

                    <img
                        src="${photo.url}"
                        alt="${photo.title}"
                        onerror="this.src='https://via.placeholder.com/500x300?text=Image+Not+Found'"
                    >

                    <div class="gallery-info">

                        <h3>
                            ${photo.title}
                        </h3>

                        <button
                            class="delete-btn"
                            onclick="deletePhoto(${index})">

                            🗑️ Delete Photo

                        </button>

                    </div>

                `;


                galleryGrid.appendChild(item);

            });

        }


        /* =========================================
           ADD PHOTO
        ========================================= */

        document
            .getElementById("galleryForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();


                const title =
                    document
                    .getElementById("photoTitle")
                    .value
                    .trim();


                const url =
                    document
                    .getElementById("photoUrl")
                    .value
                    .trim();


                if (!title || !url) {

                    showMessage(
                        "कृपया Photo Title और Photo URL दोनों भरें।",
                        "error"
                    );

                    return;
                }


                /* New Photo Object */

                const newPhoto = {

                    id: Date.now(),

                    title: title,

                    url: url

                };


                /* Add */

                galleryData.push(newPhoto);


                /* Save */

                localStorage.setItem(
                    "fpoGallery",
                    JSON.stringify(galleryData)
                );


                /* Reset Form */

                document
                    .getElementById("galleryForm")
                    .reset();


                /* Refresh */

                displayGallery();


                showMessage(
                    "✅ Photo successfully added!",
                    "success"
                );

            });


        /* =========================================
           DELETE PHOTO
        ========================================= */

        function deletePhoto(index) {

            const photo =
                galleryData[index];


            if (!photo) {

                return;

            }


            const confirmDelete =
                confirm(
                    "क्या आप यह फोटो Delete करना चाहते हैं?\n\n" +
                    photo.title
                );


            if (!confirmDelete) {

                return;

            }


            /* Delete */

            galleryData.splice(index, 1);


            /* Save Updated Data */

            localStorage.setItem(
                "fpoGallery",
                JSON.stringify(galleryData)
            );


            /* Refresh Gallery */

            displayGallery();


            showMessage(
                "🗑️ Photo successfully deleted!",
                "success"
            );

        }


        /* =========================================
           MESSAGE
        ========================================= */

        function showMessage(text, type) {

            const message =
                document.getElementById("message");


            message.textContent = text;

            message.className = type;

            message.style.display = "block";


            setTimeout(function() {

                message.style.display = "none";

            }, 3000);

        }


        /* =========================================
           LOAD GALLERY
        ========================================= */

        displayGallery();

    </script>

</body>
</html>
