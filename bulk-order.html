<form onsubmit="sendBulkOrder(); return false;">

<label>Company / Shop Name</label>
<input id="company" type="text" placeholder="Enter Company Name" required>


<label>Contact Person</label>
<input id="person" type="text" placeholder="Enter Contact Person" required>


<label>Mobile Number</label>
<input id="mobile" type="tel" placeholder="Enter Mobile Number" required>


<label>Email</label>
<input id="email" type="email" placeholder="Enter Email">


<label>Select Product</label>

<select id="product">

<option>Organic Wheat</option>
<option>Organic Chana</option>
<option>Mustard</option>
<option>Groundnut</option>
<option>Sesame</option>
<option>Arhar</option>
<option>Moong</option>
<option>Urad</option>

</select>


<label>Quantity</label>

<input id="quantity" type="text" placeholder="Example : 100 Kg / 10 Quintal" required>


<label>Delivery Address</label>

<textarea id="address" placeholder="Enter Delivery Address" required></textarea>


<label>Additional Message</label>

<textarea id="message" placeholder="Write Your Requirement"></textarea>


<button type="submit">
📦 Submit Bulk Order
</button>


</form>


<a class="whatsapp"
href="https://wa.me/918090040580?text=Hello%20Bundelkhand%20Organic%20FPO,%20I%20want%20to%20place%20a%20Bulk%20Order."
target="_blank">

💬 Order on WhatsApp

</a>


<script>

function sendBulkOrder(){

let company=document.getElementById("company").value;
let person=document.getElementById("person").value;
let mobile=document.getElementById("mobile").value;
let email=document.getElementById("email").value;
let product=document.getElementById("product").value;
let quantity=document.getElementById("quantity").value;
let address=document.getElementById("address").value;
let msg=document.getElementById("message").value;


let whatsappMessage =
`Hello Bundelkhand Organic FPO

📦 Bulk Order Request

🏢 Company:
${company}

👤 Contact Person:
${person}

📱 Mobile:
${mobile}

📧 Email:
${email}

🌾 Product:
${product}

⚖ Quantity:
${quantity}

📍 Address:
${address}

📝 Message:
${msg}`;


let url =
"https://wa.me/918090040580?text="
+encodeURIComponent(whatsappMessage);


window.open(url,"_blank");

}

</script>
